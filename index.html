<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नवरात्रि शुभकामनाएं</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <!-- शुभकामना -->
    <section class="welcome">
      <div class="small-line">🌺 शुभ नवरात्रि 🌺</div>

      <h1>
        आप को और आपके परिवार वालों को
        <span>Advance में नवरात्रि की हार्दिक शुभकामनाएं</span>
      </h1>
    </section>

    <!-- GIF -->
    <section class="gift-card">
      <img
        src="navratri_gift_animated.gif"
        alt="नवरात्रि शुभकामना"
        class="gift-gif"
      >
    </section>

    <!-- नाम -->
    <section class="share-box">

      <h2>🎁 अपना नाम इस बॉक्स में लिखें</h2>

      <p>
        नाम लिखकर आगे भेजें और अपने परिवार तथा दोस्तों को
        नवरात्रि की शुभकामनाएं दें।
      </p>

      <input
        type="text"
        id="senderName"
        placeholder="अपना नाम लिखें"
        maxlength="40"
        autocomplete="name"
      >

      <button id="shareButton">
        💝 आगे भेजें
      </button>

      <div id="message" class="message"></div>

    </section>

    <!-- Native Ad के लिए जगह -->
    <section class="ad-space">
      <div class="ad-label">Advertisement</div>
      <div class="ad-placeholder">
        यहाँ आपका Native Ad दिखाई देगा
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
